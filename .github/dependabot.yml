version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # The `Allocator` trait is public API and must match hashbrown's.
      - dependency-name: allocator-api2
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv:
        patterns:
          - "*"
