name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  rust:
    name: Rust criterion benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - uses: Swatinem/rust-cache@v2
      - name: Build benchmarks
        run: cargo codspeed build --bench speedup --bench set_ops
      - uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: cargo codspeed run

  python:
    name: Python pytest benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --features python --out dist
          sccache: true
      - name: Install
        run: |
          uv venv
          uv pip install dist/*.whl pytest pytest-codspeed pytest-benchmark
      - uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: .venv/bin/pytest benches/python/throughput.py --codspeed
