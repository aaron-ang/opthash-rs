name: Paired x86 native experiments

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: high-bit
            branch: experiment/x86-high-bit-controls
            bench: speedup
            filter: (insert|get_hit|get_miss|mixed|delete_heavy)/(insert|get_hit|get_miss|mixed|delete_heavy)_(std|hashbrown|elastic|funnel)
          - name: direct-occupied
            branch: experiment/x86-direct-occupied
            bench: map_api
            filter: (iter|drain|clear_drop)/(iter|drain|clear)_(std|hashbrown|elastic|funnel)
          - name: funnel-eight-byte
            branch: experiment/x86-funnel-eight-byte
            bench: speedup
            filter: (insert|get_hit|get_miss|mixed)/(insert|get_hit|get_miss|mixed)_(hashbrown|funnel)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure base, candidate, base
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/opthash-target
          CANDIDATE_BRANCH: ${{ matrix.branch }}
          BENCH: ${{ matrix.bench }}
          FILTER: ${{ matrix.filter }}
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP}/candidate"
          git fetch origin "$CANDIDATE_BRANCH"
          git worktree add --detach "$candidate_dir" "origin/$CANDIDATE_BRANCH"

          measure() {
            local directory=$1
            local baseline=$2
            (
              cd "$directory"
              cargo bench --bench "$BENCH" -- "$FILTER" \
                --save-baseline "$baseline" \
                --warm-up-time 1 --measurement-time 2 --sample-size 20
            )
          }

          measure "$GITHUB_WORKSPACE" base-a
          measure "$candidate_dir" candidate
          measure "$GITHUB_WORKSPACE" base-b

          cargo bench --bench "$BENCH" -- "$FILTER" \
            --load-baseline candidate --baseline base-a
          cargo bench --bench "$BENCH" -- "$FILTER" \
            --load-baseline candidate --baseline base-b
      - uses: actions/upload-artifact@v6
        with:
          name: x86-native-${{ matrix.name }}
          path: ${{ runner.temp }}/opthash-target/criterion
