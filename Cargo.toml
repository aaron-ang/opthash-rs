[package]
name = "opthash"
version = "0.10.2"
edition = "2024"
rust-version = "1.88"
description = "Rust implementations of Elastic Hashing and Funnel Hashing"
readme = "README.md"
repository = "https://github.com/aaron-ang/opthash-rs"
license = "Apache-2.0"
keywords = ["hashmap", "open_addressing", "elastic_hashing", "funnel_hashing"]
categories = ["algorithms", "data-structures"]
exclude = [
    "/benches/",
    "/opthash/",
    "/paper/",
    "/scripts/",
    "/tests/",
    "/.gitattributes",
    "/.gitignore",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/requirements.txt",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]
nightly = ["allocator-api2/nightly", "hashbrown/nightly"]

[dependencies]
allocator-api2 = { version = "0.2", default-features = false, features = [
    "alloc",
] }
equivalent = "1"
foldhash = "0.2"
pyo3 = { version = "0.29", features = [
    "extension-module",
    "abi3-py310",
], optional = true }

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "4", features = [
    "html_reports",
] }
foldhash = "0.2"
hashbrown = "0.17"
hdrhistogram = "7.5"
pprof = { version = "0.15", features = ["flamegraph"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(codspeed)'] }

[[bench]]
name = "speedup"
harness = false

[[bench]]
name = "load_factor"
harness = false

[[bench]]
name = "map_api"
harness = false

[[bench]]
name = "payload_size"
harness = false

[[bench]]
name = "set_ops"
harness = false

[[bench]]
name = "mean_latency"
harness = false
