[package]
name = "opthash"
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
description = "Rust implementations of Elastic Hashing and Funnel Hashing"
readme = "README.md"
repository = "https://github.com/aaron-ang/opthash-rs"
license = "Apache-2.0"
keywords = ["hashmap", "open_addressing", "elastic_hashing", "funnel_hashing", "no_std"]
categories = ["algorithms", "data-structures", "no-std"]
exclude = [
    "/.github/",
    "/.vscode/",
    "/benches/",
    "/ci/",
    "/python/",
    "/paper/",
    "/scripts/",
    "/tests/",
    "/.gitattributes",
    "/.gitignore",
    "/.pre-commit-config.yaml",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/pyproject.toml",
    "/uv.lock",
]

[package.metadata.docs.rs]
features = ["nightly"]
rustdoc-args = ["--generate-link-to-definition"]

[features]
default = ["std", "default-hasher"]
default-hasher = ["dep:foldhash"]
std = ["foldhash?/std", "allocator-api2/std"]
python = ["std", "dep:pyo3"]
nightly = ["allocator-api2/nightly", "foldhash?/nightly"]

[dependencies]
allocator-api2 = { version = "0.2", default-features = false, features = [
    "alloc",
] }
equivalent = "1"
foldhash = { version = "0.2", default-features = false, optional = true }
pyo3 = { version = "0.30", features = [
    "extension-module",
    "abi3-py310",
], optional = true }

[dev-dependencies]
criterion = { version = "6", package = "codspeed-criterion-compat", default-features = false, features = ["cargo_bench_support", "rayon"] }
harness = { package = "opthash-bench-harness", path = "benches/harness" }
hashbrown = "0.17"

[workspace]
members = ["benches/harness"]

[lints]
workspace = true

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(codspeed)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
borrow_as_ptr = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
mod_module_files = "warn"
undocumented_unsafe_blocks = "warn"

[[bench]]
name = "speedup"
harness = false

[[bench]]
name = "load_factor"
harness = false

[[bench]]
name = "map_api"
harness = false

[[bench]]
name = "payload_size"
harness = false

[[bench]]
name = "set_ops"
harness = false

[[bench]]
name = "mean_latency"
harness = false

[[bench]]
name = "scaled_insert"
harness = false

[[bench]]
name = "high_load"
harness = false

[[bench]]
name = "memory"
harness = false

# Layout-stable measurement profile: one codegen unit
# plus fat LTO keeps placement fixed.
[profile.bench]
lto = "fat"
codegen-units = 1
