[package]
name = "opthash"
version = "0.7.0"
edition = "2024"
description = "Rust implementations of Elastic Hashing and Funnel Hashing"
readme = "README.md"
repository = "https://github.com/aaron-ang/opthash-rs"
license = "Apache-2.0"
keywords = ["hashmap", "open_addressing", "elastic_hashing", "funnel_hashing"]
categories = ["algorithms", "data-structures"]
exclude = [
    "/benches/",
    "/opthash/",
    "/paper/",
    "/scripts/",
    "/tests/",
    "/.gitattributes",
    "/.gitignore",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/requirements.txt",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]
nightly = ["allocator-api2/nightly", "hashbrown/nightly"]

[dependencies]
allocator-api2 = { version = "0.2", default-features = false, features = ["alloc"] }
foldhash = "0.2"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"], optional = true }

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "4", features = ["html_reports"] }
hashbrown = "0.17"
hdrhistogram = "7.5"
pprof = { version = "0.15", features = ["flamegraph"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "speedup"
harness = false

[[bench]]
name = "mean_latency"
harness = false

[[bench]]
name = "tail_latency"
harness = false
